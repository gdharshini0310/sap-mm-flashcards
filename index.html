<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SAP MM Interview Flashcards</title>
<style>
:root{--bg:#eef2f6;--c:#fff;--t:#16202e;--m:#5d6b7e;--a:#0b6e8a;--at:#fff;--b:#d8e0ea;--ok:#15803d;--bad:#b91c1c;--w:#b45309;--s:#e6f1f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e141c;--c:#18212d;--t:#e8edf4;--m:#97a5b8;--a:#4cb8d6;--at:#06222b;--b:#2a3646;--ok:#4ade80;--bad:#f87171;--w:#fbbf24;--s:#17303b}}
:root[data-theme=dark]{--bg:#0e141c;--c:#18212d;--t:#e8edf4;--m:#97a5b8;--a:#4cb8d6;--at:#06222b;--b:#2a3646;--ok:#4ade80;--bad:#f87171;--w:#fbbf24;--s:#17303b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0}h2{font-size:17px;margin:22px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px}.stats span,.m{color:var(--m);font-size:13px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);padding:10px 14px;min-height:44px}
button.p{background:var(--a);color:var(--at);border-color:var(--a);font-weight:600}button:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a)}
.tp{display:flex;justify-content:space-between;gap:10px;align-items:center}.tp>div:first-child{flex:1}
.q{font:600 21px/1.35 Georgia,serif;margin:6px 0 14px}
textarea{width:100%;min-height:100px;border:1px solid var(--b);border-radius:10px;padding:10px;background:var(--bg);color:var(--t);font:inherit;resize:vertical;margin-bottom:10px}
.ans{background:var(--s);border-radius:10px;padding:12px;margin:10px 0}
ul{margin:6px 0;padding-left:20px}.chip{display:inline-block;font:13px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0}
.wow{border-left:4px solid var(--w);padding:6px 12px;margin:10px 0}.fu{border-left:4px solid var(--a);padding:6px 12px}
.rate button{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;line-height:1.3}.rate small{color:var(--m)}
.f{color:var(--bad)}.h{color:var(--w)}.g{color:var(--ok)}.lock{opacity:.6}
</style></head><body><main id="app"></main>
<script>
const T=["Enterprise Structure","Master Data","P2P Cycle","Outline Agreements"];
const C=[
[0,"Explain the enterprise structure in SAP MM.","SAP models the company as a hierarchy. The client is the top level. Company codes are legal entities with their own balance sheet. Plants are operating sites that procure, plan and hold stock, and storage locations are where stock physically sits. For buying, purchasing organizations and purchasing groups form a separate structure.","Client > Company code > Plant > Storage location|Purchasing org + purchasing group sit on the buying side|A plant belongs to exactly one company code","OX02 company code, OX10 plant, OX09 storage loc, OX01 purch. org","The plant is the central MM object: stock, valuation and MRP all hang off it.","Can one plant belong to two company codes?"],
[0,"Purchasing organization vs purchasing group?","A purchasing organization is the commercial unit that negotiates with vendors and owns prices, conditions and contracts. A purchasing group is the buyer or team handling day-to-day orders. The org has commercial authority; the group is an internal contact and reporting key.","Org = negotiates, owns conditions|Group = buyer or team, not assigned to any org|Org is assigned to company code and plant; both are needed on a PO","OX17 org to company code, OX08 plant to org, OME4 group","Orgs can be plant-specific, cross-plant or cross-company-code, which supports centralized procurement.","What is a reference purchasing organization?"],
[0,"Plant vs storage location: what is the difference?","The plant is where materials are planned, procured and valued. A storage location is a physical stock area inside a plant, like a raw material store. Quantity is tracked per storage location, while valuation and MRP happen at plant level.","Plant: planning, purchasing, valuation|Storage location: physical stock, always inside a plant|Same storage location code can exist in many plants","MARC plant data, MARD storage loc stock, MBEW valuation","In S/4HANA, valuation is at plant level only; company-code valuation is no longer supported.","Where is stock quantity stored?"],
[0,"What is a valuation area and why does it matter?","The valuation area is the level at which a material is valued: price and G/L accounts are maintained there. It can be company code or plant, and most companies use plant so each plant can have its own price. It also links to the chart of accounts through the company code.","Valuation level = plant or company code|Plant level allows a different price per plant|Drives automatic account determination in OBYC","OX14 set valuation level, MBEW","Valuation area is step one of how the system finds the G/L account for any posting.","Can you change the valuation level after postings?"],
[1,"What is the material master and what are the key material types?","The material master is the central record for every item a company buys, makes or sells. Data is stored in views such as basic, purchasing, MRP, storage and accounting. The material type controls which views exist and which accounts the material posts to. Common types are ROH raw material, HALB semi-finished, FERT finished, HAWA trading goods and DIEN services.","Views are maintained at client, plant, storage loc and valuation level|Material type controls views, number range and valuation class|ROH, HALB, FERT, HAWA, DIEN","MM01/02/03, MARA, MARC, MARD, MBEW","S/4HANA supports 40-character material numbers (18 earlier).","What is the difference between HAWA and FERT?"],
[1,"How is vendor master data structured?","Vendor data sits at three levels. General data such as name, address and bank applies everywhere. Company code data holds the reconciliation account and payment terms. Purchasing organization data holds order currency, incoterms and purchasing terms. FI and MM both maintain it.","General > Company code > Purchasing org|FI owns accounting data, MM owns purchasing data|Reconciliation account links vendor to G/L","XK01 (ECC), BP (S/4HANA), LFA1, LFB1, LFM1","In S/4HANA the Business Partner replaces separate vendor and customer masters; CVI keeps LFA1 in sync.","What is a reconciliation account?"],
[1,"What is an info record and what does it store?","An info record links one material to one vendor for a purchasing organization. It stores price conditions, delivery time, order unit and tolerances, and a PO pulls these values automatically. Types are standard, subcontracting, pipeline and consignment.","Material + vendor + purchasing org|Holds price conditions with validity dates|Types: standard, subcontracting, pipeline, consignment","ME11/ME12, EINA general, EINE purchasing org","It can be created or updated automatically from a PO using the info update indicator.","Which info record type do you use for subcontracting?"],
[1,"What is a source list and when would you use it?","A source list defines which vendors are allowed, preferred or blocked for a material in a plant during a validity period. A fixed source is proposed automatically when a PR is converted, and a blocked source cannot be ordered from. It enforces approved-vendor policy.","Fixed source = default vendor|Blocked source = cannot be used|Mandatory when source list requirement is set","ME01, ME05 generate, EORD","Typical source determination order: quota, source list, outline agreement, info record.","What if the source list requirement is set but no entry exists?"],
[2,"Walk me through the P2P cycle with T-codes and accounting.","It starts with a purchase requisition in ME51N, then an RFQ in ME41, quotation and comparison, then the PO in ME21N. Goods receipt in MIGO posts debit inventory and credit GR/IR. Invoice verification in MIRO posts debit GR/IR and credit vendor. Payment in F110 posts debit vendor and credit bank.","PR > RFQ > PO > GR > IR > Payment|PR, RFQ and PO have no accounting entry|GR: Dr Stock (BSX), Cr GR/IR (WRX)|IR: Dr GR/IR, Cr Vendor","ME51N, ME41, ME21N, MIGO 101, MIRO, F110","Only GR, IR and payment hit finance; earlier steps are commitments.","Which step creates the vendor liability?"],
[2,"What happens in the system when you post a GR against a PO?","With MIGO and movement type 101, the system creates a material document and an accounting document, increases stock in the storage location, and updates PO history and delivered quantity. Accounting is debit inventory, credit GR/IR clearing.","Material doc + accounting doc created|Stock and PO history updated|Price difference goes to PRD with standard price","MIGO 101/102, BSX/WRX, EKBE","In S/4HANA, MATDOC is the primary table and MKPF/MSEG are compatibility views.","How do you reverse a GR?"],
[2,"GR/IR vs vendor liability: what is the difference?","GR/IR is a clearing account, not a vendor payable. At GR it records goods received but not invoiced. When the invoice is posted, GR/IR is cleared and the vendor account is credited. The vendor liability exists only after invoice receipt.","GR/IR = goods received, not invoiced|Vendor = liability after MIRO|Open GR/IR at month end needs review","MB5S analysis, MR11 clearing, WRX","Open GR/IR is a key month-end close item because it affects accruals.","How do you handle old open GR/IR items?"],
[2,"Why can't MIRO post an invoice?","Invoice verification does a three-way match of PO, goods receipt and invoice. If price or quantity differ beyond tolerance, the invoice is blocked. Common causes: no GR yet, quantity or price variance, wrong tax code, or the PO is not released.","3-way match: PO, GR, invoice|Check tolerances, tax code, GR status|Blocked invoices are released in MRBR","MIRO, MRBR, OMR6 tolerances","Tolerance keys such as PP (price) and DQ (quantity) decide when an invoice blocks.","How do you release a blocked invoice?"],
[2,"What does a Purchase Order contain?","A PO has a header with vendor, currency and payment terms, items with material, quantity, price, plant and item category, and schedule lines with delivery dates. Standard document type is NB. Item category decides the process: blank standard, L subcontracting, K consignment, S third-party.","Header > Item > Schedule line|Doc type NB = standard PO|Item category drives the process|Account assignment for non-stock items","ME21N, EKKO, EKPO, EKET","Account assignment category (K, A, etc.) decides who is charged for non-stock purchases.","Which item category is used for third-party processing?"],
[3,"Contract vs scheduling agreement: what is the difference?","Both are long-term agreements with a vendor. A contract fixes price and total quantity or value, and individual POs are released against it. A scheduling agreement fixes the material and price and sends dated delivery schedule lines to the vendor, with no separate POs.","Contract: release orders (POs) against it|Scheduling agreement: schedule lines, no POs|Contract = flexible timing, SA = regular supply","ME31K contract, ME31L scheduling agreement, MK, WK, LP","Both are outline agreements: they are not sent as orders until released or scheduled.","Which one fits just-in-time supply?"],
[3,"Quantity contract vs value contract?","A quantity contract (MK) has a target quantity that each release order reduces. A value contract (WK) has a total value limit that release orders consume. Use quantity for a known material and volume, and value for mixed items or services.","MK = quantity based|WK = value based|Releases reduce the target","ME31K, MK, WK, ME21N with reference","Price is pulled from the contract automatically when you reference it in the PO.","What is a contract release order?"],
[3,"What is a blanket PO and when do you use it?","A blanket PO covers low-value, high-frequency purchases, like consumables or services, where a separate PO each time is not worth it. It has a value limit and validity period instead of fixed quantities, uses item category B, and needs account assignment.","Item category B (Limit)|Value limit + validity dates|Account assignment required","ME21N, item category B, Limit tab","Use it for unplanned, small purchases and track limit usage.","How is a blanket PO different from a value contract?"],
[3,"When would you use a scheduling agreement?","For continuous, repetitive supply with fixed schedules, common in manufacturing and automotive. MRP creates schedule lines against the agreement, and releases (forecast or JIT) go to the vendor, so no POs are needed each time.","Fixed material, price, vendor|MRP creates schedule lines|Releases: forecast or JIT","ME31L, ME38, ME84, LP","It cuts PO volume and gives vendors visibility of upcoming demand.","How are schedule lines generated?"]
];
const I=[1,3,7,14,30],td=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
let S;try{S=JSON.parse(localStorage.getItem("sapmm"))}catch(e){}S=S||{c:{},st:0,last:0,un:[]};
const save=()=>{try{localStorage.setItem("sapmm",JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");let Q=[],i=0,rev=false,tot=0;
const ids=t=>C.map((c,n)=>n).filter(n=>C[n][0]==t);
const learned=t=>ids(t).filter(n=>S.c[n]&&S.c[n].b>=1).length;
const mast=t=>ids(t).filter(n=>S.c[n]&&S.c[n].b>=3).length;
const open=t=>t==0||S.un.includes(t)||learned(t-1)/ids(t-1).length>=.8;
const due=()=>{let d=[],nw=[];C.forEach((c,n)=>{if(!open(c[0]))return;const s=S.c[n];s?s.d<=td()&&d.push(n):nw.push(n)});return d.concat(nw.slice(0,8))};
const weak=()=>C.map((c,n)=>n).filter(n=>S.c[n]&&(S.c[n].l>=2||S.c[n].b==0));
function home(){const d=due(),w=weak(),all=C.length,m=ids(0).concat(ids(1),ids(2),ids(3)).filter(n=>S.c[n]&&S.c[n].b>=3).length;
$.innerHTML=`<header><h1>SAP MM Interview Prep</h1><button onclick="th()" aria-label="Toggle theme">Theme</button></header>
<div class="stats"><div><b>${d.length}</b><span>due today</span></div><div><b>${S.last>=td()-1?S.st:0}</b><span>day streak</span></div><div><b>${Math.round(m/all*100)}%</b><span>mastered</span></div></div>
<div class="row" style="margin:12px 0"><button class="p" ${d.length?"":"disabled"} onclick="go(due())">Start today's cards</button><button ${d.length?"":"disabled"} onclick="go(due().slice(0,5))">Just 5 cards</button><button ${w.length?"":"disabled"} onclick="go(weak())">Weak cards (${w.length})</button></div>
<h2>Topics</h2>${T.map((t,k)=>{const o=open(k),n=ids(k).length;return `<div class="card ${o?"":"lock"}"><div class="tp"><div><b>${t}</b><div class="m">${n} cards, ${learned(k)} learned, ${mast(k)} mastered</div><div class="bar"><i style="width:${mast(k)/n*100}%"></i></div></div>${o?`<button onclick="go(ids(${k}).filter(n=>!S.c[n]||S.c[n].d<=td()))">Study</button>`:`<button onclick="S.un.push(${k});save();home()">Unlock anyway</button>`}</div>${o?"":`<div class="m">Opens when 80% of the previous topic is learned.</div>`}</div>`}).join("")}
<h2>Backup</h2><div class="card"><div class="m">Progress lives in this browser only. Copy the text below to keep a backup, or paste a backup and tap Import.</div><textarea id="bk" style="margin-top:8px;min-height:60px"></textarea><div class="row"><button onclick="ex()">Export</button><button onclick="im()">Import</button></div></div>`}
function th(){const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches,cur=r.dataset.theme||(d?"dark":"light");r.dataset.theme=cur=="dark"?"light":"dark"}
function ex(){const b=document.getElementById("bk");b.value=JSON.stringify(S);b.select();try{navigator.clipboard.writeText(b.value)}catch(e){}}
function im(){try{const v=JSON.parse(document.getElementById("bk").value);if(!v.c)throw 0;S=v;save();home()}catch(e){alert("That backup text is not valid.")}}
function go(q){if(!q.length)return;Q=q.slice();i=0;tot=Q.length;rev=false;study()}
function study(){if(i>=Q.length)return done();const n=Q[i],c=C[n],s=S.c[n]||{b:0,l:0},nx=k=>I[Math.min(4,s.b+k)]+"d";
$.innerHTML=`<header><button onclick="home()">Back</button><span class="m">${Math.min(i+1,Q.length)} of ${Q.length}</span></header><div class="card"><div class="m">${T[c[0]]}</div><div class="q">${c[1]}</div>
${rev?`<div class="ans">${c[2]}</div><ul>${c[3].split("|").map(p=>`<li>${p}</li>`).join("")}</ul><div>${c[4].split(",").map(x=>`<span class="chip">${x.trim()}</span>`).join("")}</div><div class="wow"><b>Stand-out line:</b> ${c[5]}</div><div class="fu"><b>Likely follow-up:</b> ${c[6]}</div>
<h2>How well did you recall it?</h2><div class="row rate"><button onclick="rate(${n},0)"><b class="f">Forgot</b><small>again today</small></button><button onclick="rate(${n},1)"><b class="h">Hard</b><small>${I[s.b]}d</small></button><button onclick="rate(${n},2)"><b class="g">Good</b><small>${nx(1)}</small></button><button onclick="rate(${n},3)"><b class="g">Easy</b><small>${nx(2)}</small></button></div>`
:`<textarea id="ans" placeholder="Say it out loud, or type your answer here first..."></textarea><button class="p" style="width:100%" onclick="rev=true;study()">Reveal model answer</button>`}</div>`;
if(!rev)document.getElementById("ans").focus({preventScroll:true})}
function rate(n,r){const s=S.c[n]||{b:0,l:0};if(r==0){s.b=0;s.l++;s.d=td()+1;Q.push(n)}else{if(r>1)s.b=Math.min(4,s.b+(r==2?1:2));s.d=td()+I[s.b]}S.c[n]=s;
if(S.last!=td()){S.st=S.last==td()-1?S.st+1:1;S.last=td()}save();i++;rev=false;study()}
function done(){$.innerHTML=`<div class="card" style="text-align:center"><h1>Session done</h1><p>You went through ${tot} cards. Come back tomorrow so spaced repetition can do its work.</p><button class="p" onclick="home()">Back to dashboard</button></div>`}
document.addEventListener("keydown",e=>{if(rev&&i<Q.length&&"1234".includes(e.key))rate(Q[i],+e.key-1)});
home();
</script></body></html>
